<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Florangè</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Florangè">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#F7EBDA">
<style>
  html,body{margin:0;height:100%;background:#F7EBDA}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;font:700 20px -apple-system,Segoe UI,Roboto,sans-serif;color:#341800;transition:opacity .3s}
  #splash img{width:96px;height:96px;border-radius:22px}
  #splash i{width:28px;height:28px;border:3px solid #34180033;border-top-color:#e77817;border-radius:50%;animation:s 0.8s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f7f5f2;padding-top:env(safe-area-inset-top);box-sizing:border-box;opacity:0;transition:opacity .3s}
  body.ready iframe{opacity:1} body.ready #splash{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="splash"><img src="icon-192.png" alt="" onerror="this.remove()"><span>Florangè</span><i></i></div>
<iframe src="https://script.google.com/macros/s/AKfycbySTjzIsZQAeUABvLHdau0SsNTQByad6pqLt1lc6_5v6dlcgt8ZUiNWoplr0gvUW3lb0w/exec" allow="clipboard-write" title="Florangè" onload="document.body.classList.add('ready')"></iframe>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
