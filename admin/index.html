<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Florangè Админ</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Florangè Админ">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#341800">
<style>
  html,body{margin:0;height:100%;background:#341800;overflow:hidden}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(120% 80% at 50% 38%,#4a2608 0%,#341800 60%);color:#F7EBDA;
    font-family:-apple-system,"Segoe UI",Roboto,sans-serif;transition:opacity .6s ease,transform .6s ease;z-index:2}
  .flower{width:140px;height:140px;animation:breathe 3.6s ease-in-out 1.8s infinite;filter:drop-shadow(0 8px 24px rgba(232,122,26,.25))}
  .flower .rot{transform-origin:256px 256px}
  .petal{transform:scale(0);opacity:0;animation:bloom .6s cubic-bezier(.2,1.5,.4,1) forwards}
  .core{transform-origin:256px 256px;transform:scale(0);animation:pop .5s cubic-bezier(.2,1.6,.4,1) .75s forwards}
  .moon{transform-origin:256px 256px;opacity:0;transform:translate(-40px,30px) scale(.6);animation:moon .7s cubic-bezier(.2,1.3,.4,1) 1s forwards}
  @keyframes moon{to{opacity:1;transform:none}}
  @keyframes bloom{to{transform:scale(1);opacity:1}}
  @keyframes pop{to{transform:scale(1)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
  .word{margin-top:18px;font:600 38px/1 Georgia,"Times New Roman",serif;letter-spacing:.02em;display:flex}
  .word span{opacity:0;transform:translateY(14px);animation:up .55s ease forwards}
  .sub{margin-top:10px;font-size:13px;letter-spacing:.32em;text-transform:uppercase;opacity:0;animation:fade .8s ease 1.5s forwards;color:#d9b99a}
  .hint{margin-top:34px;font-size:14px;min-height:18px;opacity:0;animation:fade .6s ease 1.8s forwards;color:#d9b99a;transition:opacity .35s}
  .bar{margin-top:12px;width:150px;height:3px;border-radius:3px;background:#F7EBDA22;overflow:hidden;opacity:0;animation:fade .6s ease 1.8s forwards}
  .bar i{display:block;height:100%;width:40%;border-radius:3px;background:linear-gradient(90deg,transparent,#e77817,transparent);animation:slide 1.3s ease-in-out infinite}
  @keyframes up{to{opacity:1;transform:none}}
  @keyframes fade{to{opacity:1}}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f7f5f2;padding-top:env(safe-area-inset-top);box-sizing:border-box;opacity:0;transition:opacity .6s ease;z-index:1}
  body.ready iframe{opacity:1}
  body.ready #splash{opacity:0;transform:scale(1.06);pointer-events:none}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>
<body>
<div id="splash">
  <svg class="flower" viewBox="0 0 512 512" aria-hidden="true">
    <g class="rot">
      <g id="petals"></g>
      <circle class="core" cx="256" cy="256" r="63" fill="#341800"/>
      <circle class="moon" cx="268" cy="241" r="51" fill="#F8D590"/>
    </g>
  </svg>
  <div class="word" id="word"></div>
  <div class="sub">админ-панель</div>
  <div class="hint" id="hint">Считаем продажи…</div>
  <div class="bar"><i></i></div>
</div>
<iframe src="https://script.google.com/macros/s/AKfycbySTjzIsZQAeUABvLHdau0SsNTQByad6pqLt1lc6_5v6dlcgt8ZUiNWoplr0gvUW3lb0w/exec?p=admin" allow="clipboard-write" title="Florangè" onload="window.__loaded=true;window.__tryReady&&window.__tryReady()"></iframe>
<script>
(function(){
  var g = document.getElementById('petals'), ns = 'http://www.w3.org/2000/svg';
  for (var i = 0; i < 6; i++) {
    var ang = (-90 + i * 60) * Math.PI / 180, cx = 256 + 104 * Math.cos(ang), cy = 256 + 104 * Math.sin(ang);
    var c = document.createElementNS(ns, 'circle');
    c.setAttribute('cx', cx.toFixed(1)); c.setAttribute('cy', cy.toFixed(1)); c.setAttribute('r', '64'); c.setAttribute('fill', '#E87A1A');
    c.setAttribute('class', 'petal'); c.style.transformOrigin = cx.toFixed(1) + 'px ' + cy.toFixed(1) + 'px'; c.style.animationDelay = (i * 0.1) + 's';
    g.appendChild(c);
  }
  var w = document.getElementById('word'), t = 'Florangè';
  for (var k = 0; k < t.length; k++) { var s = document.createElement('span'); s.textContent = t[k]; s.style.animationDelay = (0.7 + k * 0.06) + 's'; w.appendChild(s); }
  var hints = ["Считаем продажи…","Проверяем смены…","Смотрим витрину…","Готовим отчёт…"], hi = 0, el = document.getElementById('hint');
  var timer = setInterval(function(){ el.style.opacity = 0; setTimeout(function(){ hi = (hi + 1) % hints.length; el.textContent = hints[hi]; el.style.opacity = 1; }, 350); }, 1900);
  var t0 = Date.now();
  window.__tryReady = function(){
    if (!window.__loaded) return;
    var wait = Math.max(0, 1600 - (Date.now() - t0));
    setTimeout(function(){ document.body.classList.add('ready'); clearInterval(timer); setTimeout(function(){ var sp = document.getElementById('splash'); if (sp) sp.remove(); }, 800); }, wait);
  };
  window.__tryReady();
})();
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
